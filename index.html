<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passing Square</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a; font-family: 'Barlow', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; color: #fff;
  }

  .header { text-align: center; margin-bottom: 14px; }
  .header h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px;
    letter-spacing: 2px; text-transform: uppercase; color: #C61D23;
  }
  .header p { font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  .phase-label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: #fff; background: #C61D23;
    padding: 4px 16px; margin-bottom: 12px; min-width: 290px; text-align: center;
  }

  .scene { position: relative; width: 400px; height: 580px; }

  .field {
    position: absolute; top: 30px; left: 40px; width: 320px; height: 520px;
    background: #1a5c1a; border: 2px solid rgba(255,255,255,0.7); border-radius: 2px;
  }
  .field::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, transparent, transparent 52px,
      rgba(255,255,255,0.04) 52px, rgba(255,255,255,0.04) 104px);
  }

  /* Progression banner — flashes up across the top of the green */
  .banner {
    position: absolute; left: 50%; transform: translateX(-50%); top: 42px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700;
    letter-spacing: 5px; text-transform: uppercase; text-indent: 5px;
    color: #ffffff;
    -webkit-text-stroke: 0.9px #C61D23;
    paint-order: stroke fill;   /* red edging sits outside the glyph, white stays crisp */
    text-shadow: 0 0 6px rgba(198,29,35,0.55);
    background: rgba(8,8,8,0.94); border: 1px solid #C61D23;
    padding: 6px 24px; white-space: nowrap;
    opacity: 0; transition: opacity 0.35s; z-index: 40; pointer-events: none;
  }
  /* Long-form banner — a full sentence, so it wraps and drops in size */
  .banner.long {
    font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-indent: 1.5px;
    white-space: normal; max-width: 296px; text-align: center; line-height: 1.45;
    padding: 7px 16px;
  }
  .banner.show { opacity: 1; animation: bannerFlash 1.5s ease-in-out; }
  @keyframes bannerFlash {
    0%,100% { opacity: 1 } 20% { opacity: 0.15 } 40% { opacity: 1 } 60% { opacity: 0.15 }
  }

  /* Grid label */
  .grid-label {
    position: absolute; font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: rgba(255,255,255,0.7); z-index: 12; white-space: nowrap;
  }

  /* ── Players ── */
  .player {
    position: absolute; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
    /* 0.45s delay: the ball travels first, the players follow it */
    transition: left 0.85s cubic-bezier(0.4,0,0.2,1) 0.45s,
                top  0.85s cubic-bezier(0.4,0,0.2,1) 0.45s;
    z-index: 10;
  }
  .player.blue { background: #1a6eb5; box-shadow: 0 0 8px rgba(26,110,181,0.5); }

  /* Ball */
  .ball {
    position: absolute; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 1px solid #bbb; z-index: 20;
    transition: left 0.85s cubic-bezier(0.4,0,0.2,1), top 0.85s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 8px rgba(255,255,255,0.9);
  }

  /* Arrow layer */
  .arrows-svg {
    position: absolute; top: 0; left: 0; width: 400px; height: 580px;
    pointer-events: none; z-index: 15; opacity: 0; transition: opacity 0.4s;
  }
  .arrows-svg.show { opacity: 1; }

  /* Static cone / square layer — always visible, sits under the players */
  .cones-svg {
    position: absolute; top: 0; left: 0; width: 400px; height: 580px;
    pointer-events: none; z-index: 4;
  }

  /* Legend */
  .legend { display: flex; gap: 14px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
  .legend-item {
    display: flex; align-items: center; gap: 5px; font-size: 11px; color: #bbb;
    font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase;
  }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend-dot.blue { background: #1a6eb5; }
  .legend-dot.cone { background: #f2d21a; border-radius: 2px; }

  .step-indicators { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; justify-content: center; max-width: 360px; }
  .step-dot { width: 7px; height: 7px; border-radius: 50%; background: #333; transition: background 0.3s; }
  .step-dot.active { background: #C61D23; }
  .step-dot.done   { background: #555; }

  .desc {
    font-size: 11px; color: #777; text-align: center; max-width: 340px;
    margin-top: 6px; line-height: 1.5; min-height: 32px;
  }

  .controls { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .btn {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 18px;
    border: none; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary            { background: #C61D23; color: #fff; }
  .btn-primary:hover      { background: #e02228; }
  .btn-secondary          { background: transparent; color: #888; border: 1px solid #333; }
  .btn-secondary:hover    { border-color: #666; color: #ccc; }

  /* TSI Logo */
  .tsi-logo-wrap{display:flex;justify-content:center;padding:0 0 12px;width:100%;}
  .tsi-logo{height:38px;width:auto;display:block;}
</style>
</head>

<div class="header">
  <h1>Passing Square</h1>
  <p>Passing &amp; Receiving</p>
</div>

<div class="phase-label" id="phaseLabel">Team Set</div>

<div class="scene">
  <div class="field"></div>

  <!-- Static cones + square outline -->
  <svg class="cones-svg" viewBox="0 0 400 580">
    <polygon points="94.4,186 305.6,186 305.6,394 94.4,394"
             fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.4" stroke-dasharray="6,4"/>
    <!-- Yellow cone at every corner -->
    <g fill="#f2d21a" stroke="rgba(0,0,0,0.55)" stroke-width="0.8">
      <circle cx="94.4"  cy="186" r="5"/>
      <circle cx="305.6" cy="186" r="5"/>
      <circle cx="305.6" cy="394" r="5"/>
      <circle cx="94.4"  cy="394" r="5"/>
    </g>
  </svg>

  <div class="banner" id="banner"></div>

  <div class="grid-label" style="left:50px; top:528px;">20 × 20</div>

  <!-- Pass arrow -->
  <svg class="arrows-svg" id="svgPass" viewBox="0 0 400 580">
    <defs>
      <marker id="mPB" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
        <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a6eb5"/>
      </marker>
    </defs>
    <path id="pass" stroke="#1a6eb5" stroke-width="2.6" fill="none" marker-end="url(#mPB)"/>
  </svg>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot blue"></div>Blue — 5 players</div>
  <div class="legend-item"><div class="legend-dot cone"></div>Cone</div>
</div>

<div class="step-indicators" id="stepDots"></div>
<div class="desc" id="desc"></div>

<div class="controls">
  <button class="btn btn-secondary" id="prevBtn" onclick="changePhase(-1)">← Back</button>
  <button class="btn btn-primary"   id="playBtn" onclick="toggleAuto()">▶ Auto</button>
  <button class="btn btn-secondary" id="nextBtn" onclick="changePhase(1)">Next →</button>
</div>

<script>
// ── Geometry ─────────────────────────────────────────────────────────
// Field in scene: left 40, top 30, w 320, h 520  (scene 400 × 580)
const FL=40, FT=30, FW=320, FH=520;

function p(px,py){ return [ FL + px/100*FW - 12,   FT + py/100*FH - 12   ]; }
function b(px,py){ return [ FL + px/100*FW - 6.5,  FT + py/100*FH - 6.5  ]; }
function ctr(pos){ return [ pos[0]+12, pos[1]+12 ]; }

// ── Cones (drawn in the static SVG above) ─────────────────────────────
// 20 × 20 square, corners at (17,30) (83,30) (83,70) (17,70).
// Players stand just OUTSIDE their corner so every cone stays visible.
const pTL = p(12,27), pTR = p(88,27), pBR = p(88,73), pBL = p(12,73);

// The spare, queued behind the top-left corner
const Q = p(7,22);

// "Just followed my pass" slots, outside the square, for the CLOCKWISE lap
const bhTRcw = p(78,24), bhBRcw = p(89,66), bhBLcw = p(22,76), bhTLcw = p(11,34);
// ...and for the COUNTER-CLOCKWISE lap
const bhBLccw = p(11,66), bhBRccw = p(78,76), bhTRccw = p(89,34), bhTLccw = p(22,24);

// 1-2 support positions — the passer travels the length of the pass and stops
// a couple of strides OFF THE RECEIVER, close enough to be a real option but
// far enough that the set-back and the lay-off are proper passes.
// Counter-clockwise legs.
const sBL = p(12,63), sBR = p(73,73), sTR = p(88,37), sTL = p(27,27);

// Receive-on-the-run positions — the return is played into the path, bending
// inside the yellow cone and finishing outside the dotted line, past the
// corner and already heading for the next station.
const rBL = p(24,77), rBR = p(90,64), rTR = p(78,21), rTL = p(10,36);

// Ball positions
const bTL = b(12,27), bTR = b(88,27), bBR = b(88,73), bBL = b(12,73);
const bsBL = b(12,63), bsBR = b(73,73), bsTR = b(88,37), bsTL = b(27,27);
const brBL = b(24,77), brBR = b(90,64), brTR = b(78,21), brTL = b(10,36);

// ── Phases ────────────────────────────────────────────────────────────
// blue[] is indexed by player number (1..5).
const phases = [

  // ── Basic pattern — round the square clockwise, follow your pass ────
  {
    label:"Team Set",
    desc:"Five players, four cones. One on each corner of the 20×20, one spare queued behind the top-left. Ball starts top-left and the square works clockwise.",
    blue: [pTL, pTR, pBR, pBL, Q],
    ball: bTL, pass:null
  },
  {
    label:"First Pass",
    desc:"Two touch — one to control, one to pass. Play to the next corner and follow your pass; the spare steps onto the corner you've left.",
    blue: [bhTRcw, pTR, pBR, pBL, pTL],
    ball: bTR, pass:[pTL,pTR]
  },
  {
    label:"Second Pass",
    desc:"Down the right side. Open the body before the ball arrives so the second touch is already travelling the right way.",
    blue: [pTR, bhBRcw, pBR, pBL, pTL],
    ball: bBR, pass:[pTR,pBR]
  },
  {
    label:"Third Pass",
    desc:"Along the bottom. Square corners mean the ball changes direction 90° every time — the first touch has to do that work.",
    blue: [pTR, pBR, bhBLcw, pBL, pTL],
    ball: bBL, pass:[pBR,pBL]
  },
  {
    label:"Back to the Start",
    desc:"Up the left side and the ball is home. Everyone has moved on one corner and the lap repeats.",
    blue: [pTR, pBR, pBL, Q, pTL],
    ball: bTL, pass:[pBL,pTL]
  },

  // ── Progression 1 — same pattern the other way round ────────────────
  {
    label:"Opposite Way — First Pass",
    banner:"Progression 1",
    desc:"Progression 1: same square, opposite direction. Now it runs counter-clockwise, so every player receives on the other side and passes off the other foot.",
    blue: [pTR, pBR, pBL, pTL, bhBLccw],
    ball: bBL, pass:[pTL,pBL]
  },
  {
    label:"Opposite Way — Second Pass",
    desc:"Along the bottom, left to right. The turn is the same 90° but towards the other shoulder — that's the whole point of the reversal.",
    blue: [pTR, pBR, bhBRccw, pTL, pBL],
    ball: bBR, pass:[pBL,pBR]
  },
  {
    label:"Opposite Way — Third Pass",
    desc:"Up the right side. Follow your pass every time — the movement is what makes it a passing exercise rather than a passing drill.",
    blue: [pTR, bhTRccw, pBR, pTL, pBL],
    ball: bTR, pass:[pBR,pTR]
  },
  {
    label:"Opposite Way — Complete",
    desc:"Back along the top to the start. Run both directions for equal reps before moving on.",
    blue: [Q, pTR, pBR, pTL, pBL],
    ball: bTL, pass:[pTR,pTL]
  },

  // ── Progression 2 — a 1-2 at every corner ───────────────────────────
  // Three phases per corner so all three passes actually travel:
  //   1) player 1 passes in and travels with it to support off player 2
  //   2) player 2 sets it back first time
  //   3) player 1 plays it into player 2's path — inside the cone, out past
  //      the dotted line — and player 2 runs onto it.
  {
    label:"1-2 — Ball In",
    banner:"Progression 2",
    desc:"Progression 2: every corner becomes a 1-2. Play in and travel with the pass, right up to within a stride or two of the receiver.",
    blue: [Q, pTR, pBR, sBL, pBL],
    ball: bBL, pass:[pTL,pBL]
  },
  {
    label:"1-2 — Set Back",
    desc:"The set. One touch straight back into the player who has come to meet it — no control, no delay.",
    blue: [Q, pTR, pBR, sBL, pBL],
    ball: bsBL, pass:[pBL,sBL]
  },
  {
    label:"1-2 — Into the Path",
    desc:"The return goes into the path, never to the feet — inside the yellow cone and back out past the dotted line, where the receiver runs onto it already facing the next corner. The spare steps onto the top-left.",
    blue: [pTL, pTR, pBR, sBL, rBL],
    ball: brBL, pass:[sBL,rBL,-14]
  },
  {
    label:"1-2 — Ball In",
    desc:"Same again along the bottom — played in on the move, and the passer travels with it. The supporting player steps onto the corner that's just been vacated.",
    blue: [pTL, pTR, pBR, pBL, sBR],
    ball: bBR, pass:[rBL,pBR]
  },
  {
    label:"1-2 — Set Back",
    desc:"Set it back first time. On a 20×20 that's a long run to make — go the moment the pass leaves your foot.",
    blue: [pTL, pTR, pBR, pBL, sBR],
    ball: bsBR, pass:[pBR,sBR]
  },
  {
    label:"1-2 — Into the Path",
    desc:"Bent inside the cone and out past the line again, so the receiver is already running up the right side.",
    blue: [pTL, pTR, rBR, pBL, sBR],
    ball: brBR, pass:[sBR,rBR,-14]
  },
  {
    label:"1-2 — Ball In",
    desc:"Up the right side. Firm into the back foot — a soft one lets the set-back die.",
    blue: [pTL, pTR, sTR, pBL, pBR],
    ball: bTR, pass:[rBR,pTR]
  },
  {
    label:"1-2 — Set Back",
    desc:"The set back again — one touch, every time. That's the standard for the whole exercise.",
    blue: [pTL, pTR, sTR, pBL, pBR],
    ball: bsTR, pass:[pTR,sTR]
  },
  {
    label:"1-2 — Into the Path",
    desc:"Inside the cone, out past the line, away along the top. The passer stays in behind that corner.",
    blue: [pTL, rTR, sTR, pBL, pBR],
    ball: brTR, pass:[sTR,rTR,-14]
  },
  {
    label:"1-2 — Ball In",
    desc:"Last corner of the lap — the ball goes in to the player on the top-left, and the passer travels all the way in to support.",
    blue: [pTL, sTL, pTR, pBL, pBR],
    ball: bTL, pass:[rTR,pTL]
  },
  {
    label:"1-2 — Set Back",
    desc:"Set back into the player who has stepped in from the previous corner.",
    blue: [pTL, sTL, pTR, pBL, pBR],
    ball: bsTL, pass:[pTL,sTL]
  },
  {
    label:"1-2 Complete",
    desc:"Final return bent inside the top-left cone and out past the line — everyone has moved on one corner and the ball is running away from the start, ready for the next lap. Four 1-2s per lap, no stopping.",
    blue: [rTL, sTL, pTR, pBL, pBR],
    ball: brTL, pass:[sTL,rTL,-14]
  },

  // ── Progression 3 — 1-2, then skip the next corner ──────────────────
  // Identical opening, but instead of returning it to player 2, player 1 plays
  // long past them into player 3. Player 2 leaves their cone at that moment and
  // runs into support off player 3, who lays it off — and player 2 then plays
  // long into player 4. Nobody queues: four on the cones, one always running in.
  {
    label:"Ball In",
    banner:"Progression 3",
    desc:"Progression 3. It starts exactly the same: play in, travel with the pass, support off the receiver.",
    blue: [sBL, sTL, pTR, pBL, pBR],
    ball: bBL, pass:[rTL,pBL]
  },
  {
    label:"Set Back",
    desc:"Set back first time, same as before. Everything up to here is Progression 2.",
    blue: [sBL, sTL, pTR, pBL, pBR],
    ball: bsBL, pass:[pBL,sBL]
  },
  {
    label:"Play Past to the Third",
    desc:"Here's the difference. Instead of returning it, player 1 plays long past the second corner into the third. As the pass leaves, player 2 breaks off their cone to support the receiver — and player 1 fills the corner player 2 has just left.",
    blue: [pBL, pTL, pTR, sBR, pBR],
    ball: bBR, pass:[sBL,pBR]
  },
  {
    label:"Lay Off",
    desc:"The third corner lays it off first time into player 2, who has arrived in support. Same picture as the set-back — different pair of players.",
    blue: [pBL, pTL, pTR, sBR, pBR],
    ball: bsBR, pass:[pBR,sBR]
  },
  {
    label:"Play Past to the Fourth",
    desc:"Player 2 now plays long into the fourth corner, the third breaks off to support, and player 2 fills the corner behind. The pattern is rolling.",
    blue: [pBL, pTL, pTR, pBR, sTR],
    ball: bTR, pass:[sBR,pTR]
  },
  {
    label:"Lay Off",
    desc:"Laid off first time again. One touch on every lay-off — that's what keeps the rhythm.",
    blue: [pBL, pTL, pTR, pBR, sTR],
    ball: bsTR, pass:[pTR,sTR]
  },
  {
    label:"Play Past to the Top",
    desc:"Long again, back into the top-left. The fourth breaks off to support and the corner behind gets filled.",
    blue: [pBL, pTL, sTL, pBR, pTR],
    ball: bTL, pass:[sTR,pTL]
  },
  {
    label:"Lay Off",
    desc:"Laid off into the supporting player at the top of the square.",
    blue: [pBL, pTL, sTL, pBR, pTR],
    ball: bsTL, pass:[pTL,sTL]
  },
  {
    label:"Complete",
    desc:"Long into the second corner and the lap is closed — same shape as where Progression 3 started, one player further round. Four on the cones, one always running in to support, no queue at all.",
    blue: [pBL, sBL, pTL, pBR, pTR],
    ball: bBL, pass:[sTL,pBL]
  }
];

// ── Create DOM ────────────────────────────────────────────────────────
const scene = document.querySelector('.scene');
const els = { blue:[], ball:null };

function createAll(){
  ['1','2','3','4','5'].forEach(n=>{
    const el = document.createElement('div');
    el.className = 'player blue';
    el.textContent = n;
    scene.appendChild(el);
    els.blue.push(el);
  });
  const ball = document.createElement('div');
  ball.className = 'ball';
  scene.appendChild(ball);
  els.ball = ball;
}

// ── Render phase ──────────────────────────────────────────────────────
let current=0, isAuto=false, timer=null;

// spec = [fromPos, toPos, curve?] — curve is a perpendicular bow in px, signed
// so the return always bends to the inside of the cone.
function drawPass(id, spec){
  const el = document.getElementById(id);
  if(!spec){ el.setAttribute('d',''); return; }
  const f = ctr(spec[0]), t = ctr(spec[1]), c = spec[2] || 0;
  if(!c){ el.setAttribute('d', `M${f[0]},${f[1]} L${t[0]},${t[1]}`); return; }
  const mx=(f[0]+t[0])/2, my=(f[1]+t[1])/2;
  const dx=t[0]-f[0], dy=t[1]-f[1], len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  el.setAttribute('d', `M${f[0]},${f[1]} Q${mx+nx*c},${my+ny*c} ${t[0]},${t[1]}`);
}

function applyPhase(idx){
  const ph = phases[idx];

  els.blue.forEach((el,i)=>{
    el.style.left = ph.blue[i][0]+'px';
    el.style.top  = ph.blue[i][1]+'px';
  });

  els.ball.style.left = ph.ball[0]+'px';
  els.ball.style.top  = ph.ball[1]+'px';

  drawPass('pass', ph.pass);
  document.getElementById('svgPass').classList.toggle('show', !!ph.pass);

  // Progression banner — re-trigger the flash each time we land on the phase
  const bn = document.getElementById('banner');
  bn.className = 'banner';
  if(ph.banner){
    bn.textContent = ph.banner;
    if(ph.bannerLong) bn.classList.add('long');
    void bn.offsetWidth;          // force reflow so the animation restarts
    bn.classList.add('show');
  }

  document.getElementById('phaseLabel').textContent = ph.label;
  document.getElementById('desc').textContent = ph.desc;

  document.querySelectorAll('.step-dot').forEach((d,i)=>{
    d.classList.toggle('active', i===idx);
    d.classList.toggle('done',   i<idx);
  });
  document.getElementById('prevBtn').style.opacity = idx===0 ? '0.3':'1';
  document.getElementById('nextBtn').style.opacity = idx===phases.length-1 ? '0.3':'1';
}

function changePhase(dir){
  const next = Math.max(0, Math.min(phases.length-1, current+dir));
  if(next!==current){ current=next; applyPhase(current); }
  if(current===phases.length-1 && isAuto) stopAuto();
}

function toggleAuto(){
  if(isAuto){ stopAuto(); return; }
  isAuto=true;
  document.getElementById('playBtn').textContent='⏸ Pause';
  if(current===phases.length-1){ current=0; applyPhase(0); }
  timer=setInterval(()=>{
    if(current<phases.length-1){ current++; applyPhase(current); }
    else stopAuto();
  }, 2400);
}

function stopAuto(){
  isAuto=false; clearInterval(timer);
  document.getElementById('playBtn').textContent='▶ Auto';
}

// ── Init ──────────────────────────────────────────────────────────────
phases.forEach(()=>{
  const d=document.createElement('div');
  d.className='step-dot';
  document.getElementById('stepDots').appendChild(d);
});

createAll();
applyPhase(0);
</script>
</body>
</html>
